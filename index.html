<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Algorithms, Step by Step</title>
<meta name="description" content="Interactive, step-through visualizations for learning algorithms.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<link rel="stylesheet" href="assets/css/base.css">
<style>
.hero { padding-block: 28px 4px; }
.hero h1 { font-size: clamp(32px, 5vw, 48px); }
.find { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.find input[type=search] { font-family: var(--body); width: min(320px, 100%); background: var(--panel); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { padding: 5px 12px; border-radius: 999px; font-size: 13px; }
.chip[aria-pressed="true"] { background: var(--fg); color: var(--bg); border-color: var(--fg); }
.count { font-size: 13px; color: var(--muted); margin: 0; }
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(280px, 100%), 1fr)); gap: 16px; }
.card { display: grid; gap: 8px; align-content: start; text-decoration: none; color: inherit;
  transition: border-color .2s, transform .2s; }
.card:hover { border-color: var(--curve); transform: translateY(-2px); }
.card h2 { font: 700 20px/1.2 var(--display); margin: 0; }
.card p { margin: 0; color: var(--muted); font-size: 14px; }
.card .meta { margin-top: 4px; }
.empty { color: var(--muted); }
.keys { font-size: 13px; color: var(--muted); margin: 0; }
kbd { font: 12px var(--mono); border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 4px; padding: 0 5px; background: var(--panel); }
</style>
</head>
<body>
<div class="wrap">
  <header class="hero">
    <h1>Algorithms, step by step</h1>
    <p>Each page runs an algorithm one line at a time. Watch the variables change, read why each step happens, and try it on your own input.</p>
  </header>

  <div class="find">
    <input type="search" id="q" placeholder="Search algorithms" aria-label="Search algorithms">
    <div class="chips" id="chips"></div>
  </div>
  <p class="count" id="count"></p>
  <div class="cards" id="cards"></div>
  <p class="keys">On every page: <kbd>Space</kbd> play/pause · <kbd>←</kbd> <kbd>→</kbd> step · <kbd>R</kbd> restart</p>
</div>

<script src="algorithms.js"></script>
<script>
const esc = s => String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
const list = [...window.ALGORITHMS].sort((a, b) => a.title.localeCompare(b.title));
const tags = [...new Set(list.flatMap(a => a.tags))].sort();
let active = "All";

const chips = document.getElementById("chips");
chips.innerHTML = ["All", ...tags].map(t =>
  `<button type="button" class="chip" data-tag="${esc(t)}" aria-pressed="${t === active}">${esc(t)}</button>`).join("");
chips.onclick = e => {
  const b = e.target.closest("button");
  if (!b) return;
  active = b.dataset.tag;
  chips.querySelectorAll("button").forEach(c => c.setAttribute("aria-pressed", c === b));
  draw();
};

const q = document.getElementById("q");
q.oninput = draw;

function draw() {
  const term = q.value.trim().toLowerCase();
  const shown = list.filter(a =>
    (active === "All" || a.tags.includes(active)) &&
    (!term || [a.title, a.summary, ...a.tags].join(" ").toLowerCase().includes(term)));
  document.getElementById("count").textContent = `${shown.length} of ${list.length} algorithms`;
  document.getElementById("cards").innerHTML = shown.length ? shown.map(a => `
    <a class="panel card" href="algorithms/${esc(a.slug)}/">
      <h2>${esc(a.title)}</h2>
      <p>${esc(a.summary)}</p>
      <div class="meta">${a.tags.map(t => `<span class="tag">${esc(t)}</span>`).join("")}
        ${a.complexity ? `<span class="tag mono">${esc(a.complexity)}</span>` : ""}</div>
    </a>`).join("") : `<p class="empty">No algorithms match that search.</p>`;
}
draw();
</script>
</body>
</html>
