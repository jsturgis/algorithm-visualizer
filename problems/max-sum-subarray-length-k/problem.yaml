title: Largest Sum of a Length-k Subarray
summary: Slide a fixed-size window one step at a time, adding the element that enters and subtracting the one that leaves.
explanation: >-
  Every window has exactly `k` elements. Sum the first `k` once; after that, sliding the window one
  step right adds one new element and drops one old one, so each new window's sum costs `O(1)`
  instead of re-adding `k` numbers. Track the largest sum seen.
source: Sliding-window example (fixed size)
tags: [Arrays, Sliding window]
complexity: { time: O(n), space: O(1) }
entry: maxSumOfLengthK
limits: { time_ms: 100 }
input:
  - { name: nums, type: "int[]", length: [1, 100000], value: [-10000, 10000] }
  - { name: k, type: int, value: [1, 100000] }
returns: int
constraints_note:
  - "`k ≤ nums.length`."
visualization:
  default: { nums: [3, -1, 4, 12, -8, 5, 6], k: 4 }
  limits:
    nums: { length: [1, 12], value: [-99, 99] }
    k: { value: [1, 12] }
