title: Palindrome Check
summary: Compare characters from both ends inward; the first mismatch proves it isn't a palindrome.
explanation: >-
  A palindrome reads the same forwards and backwards, so the first character must equal the last, the
  second must equal the second-to-last, and so on. Two pointers walk in from the ends comparing pairs.
  The first mismatch answers false immediately; if they meet in the middle, it's a palindrome.
source: Two-pointer warm-up (compare LeetCode 125)
tags: [Strings, Two pointers]
complexity: { time: O(n), space: O(1) }
entry: isPalindrome
limits: { time_ms: 200 }
input:
  - { name: s, type: string, length: [1, 100000], chars: "[a-z]" }
returns: bool
visualization:
  default: { s: racecar }
  limits:
    s: { length: [1, 14] }
